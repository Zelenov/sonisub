[package]
name = "captions"
version = "0.3.0"
edition = "2024"
description = "Words with timing → cues → SRT, WebVTT, ASS, Premiere Pro transcript; the CAPT transcript format"
repository = "https://github.com/Zelenov/sonisub"
license = "MIT"
readme = "README.md"
keywords = ["subtitles", "srt", "webvtt", "ass", "captions"]
categories = ["multimedia", "text-processing"]
include = ["src/**", "Cargo.toml", "README.md", "LICENSE"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
