[package]
name = "sonisub"
version = "0.8.0"
edition = "2024"
description = "Generate .srt subtitles from video/audio files with Soniox speech-to-text"
repository = "https://github.com/Zelenov/sonisub"
license = "MIT"
readme = "README.md"
keywords = ["subtitles", "srt", "speech-to-text", "soniox", "transcription"]
categories = ["multimedia::audio", "command-line-utilities"]
# The crate as published: sources, README, license, and the build script with the icon it embeds. Tests and their videos stay in the repository.
include = ["src/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE", "version.md", "build.rs", "docs/icon/sonisub.ico"]

[features]
default = ["cli"]
# The `sonisub` command line. Programs using sonisub as a library turn it off
# (`default-features = false`) and build neither clap nor ctrlc.
cli = ["dep:clap", "dep:ctrlc"]

[workspace]
members = [".", "captions"]
# Plain `cargo build` / `cargo test` / `cargo clippy` cover both crates.
default-members = [".", "captions"]

[[bin]]
name = "sonisub"
path = "src/main.rs"
required-features = ["cli"]

# The icon of sonisub.exe (build.rs); only when building on Windows.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dependencies]
anyhow = "1.0.104"
captions = { version = "0.2.0", path = "captions" }
clap = { version = "4.6.7", features = ["derive", "env"], optional = true }
ctrlc = { version = "3.5.2", optional = true }
flacenc = "0.5.1"
humantime = "2.4.0"
indicatif = "0.18.6"
log = "0.4"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "multipart", "query", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
symphonia = { version = "0.6.1", features = ["aac", "isomp4", "mp3", "pcm", "flac", "vorbis", "ogg", "wav", "alac", "adpcm"] }
tempfile = "3.27.0"
which = "8.0.6"

[profile.release]
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
symphonia = { version = "0.6.1", features = ["aac", "isomp4", "flac"] }
tempfile = "3.27.0"
which = "8.0.6"
