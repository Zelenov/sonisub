name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: ci-linux
    runs-on: ubuntu-24.04
    env:
      # Job level: a step's own env is not visible to its `if`.
      SONIOX_API_KEY: ${{ secrets.SONIOX_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      # Both ways the crate is used: the command line, and the library alone (frename).
      - name: Clippy
        run: |
          cargo clippy --all-targets --locked -- -D warnings
          cargo clippy --locked --no-default-features -- -D warnings

      - name: Test
        run: cargo test --locked

      # A real Soniox round trip (a few seconds of audio) when the secret is set; skipped otherwise.
      - name: Live test
        if: env.SONIOX_API_KEY != ''
        run: cargo test --locked --test live -- --ignored

  windows:
    name: ci-windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

  # captions-wasm: the browser package (its own Cargo workspace), tested under Node and packed as
  # the release workflow packs it.
  wasm:
    name: ci-wasm
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: captions-wasm
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # The toolchain rust-toolchain.toml pins, with the WebAssembly target.
      - name: WebAssembly target
        run: rustup target add wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: captions-wasm

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.15.0

      - name: Version follows captions
        run: |
          v() { sed -n 's/^version[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' "$1" | head -1; }
          [ "$(v Cargo.toml)" = "$(v ../captions/Cargo.toml)" ] || { echo "::error::captions-wasm $(v Cargo.toml) is not captions $(v ../captions/Cargo.toml)"; exit 1; }

      - name: Format
        run: cargo fmt -- --check

      - name: Clippy
        run: cargo clippy --all-targets --locked --target wasm32-unknown-unknown -- -D warnings

      - name: Test
        run: wasm-pack test --node -- --locked

      - name: Package
        run: |
          wasm-pack build --release --target web -- --locked
          wasm-pack pack
          ls -la pkg

      - uses: actions/upload-artifact@v4
        with:
          name: captions-wasm
          path: captions-wasm/pkg/*.tgz
