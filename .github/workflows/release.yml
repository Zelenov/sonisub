name: Release
run-name: Release - ${{ github.ref_name }}

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    paths: ["version.md"]

jobs:
  prepare:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
      version: ${{ steps.vars.outputs.version }}
      name: ${{ steps.vars.outputs.name }}
      draft: ${{ steps.vars.outputs.draft }}
      should_build: ${{ steps.vars.outputs.should_build }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute variables
        id: vars
        run: |
          VERSION=$(sed -n '1s/^#[[:space:]]*//p' version.md | tr -d '[:space:]')
          [ -z "$VERSION" ] && { echo "::error::version.md first line must be '# VERSION'"; exit 1; }
          # A feature branch keeps '# NEXT' until the version is set at merge time: nothing to release.
          if [ "$VERSION" = NEXT ]; then
            echo "version.md starts with '# NEXT': no release."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CARGO_VERSION=$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::version.md says $VERSION, Cargo.toml says $CARGO_VERSION"; exit 1
          fi
          BRANCH="${{ github.ref_name }}"
          SAFE=$(echo "$BRANCH" | sed 's/\//-/g;s/[^a-zA-Z0-9._-]/-/g;s/-*$//')
          [ -z "$SAFE" ] && SAFE=branch
          if [ "$BRANCH" = main ] || [ "$BRANCH" = master ]; then
            TAG="v$VERSION"; NAME="sonisub v$VERSION"; DRAFT=false
          else
            TAG="v$VERSION-$SAFE"; NAME="sonisub v$VERSION - $SAFE"; DRAFT=true
          fi

          if gh release view "$TAG" --repo ${{ github.repository }} 2>/dev/null; then
            EXISTS=true
          else
            EXISTS=false
          fi

          if [ "$DRAFT" = true ] || [ "$EXISTS" = false ]; then SHOULD_BUILD=true; else SHOULD_BUILD=false; fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "draft=$DRAFT" >> "$GITHUB_OUTPUT"
          echo "should_build=$SHOULD_BUILD" >> "$GITHUB_OUTPUT"

          awk '/^# / { if (found) exit; found=1 } found' version.md > release-notes.md
          [ -s release-notes.md ] || echo "See version.md" > release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/upload-artifact@v4
        if: steps.vars.outputs.should_build == 'true'
        with:
          name: release-notes
          path: release-notes.md

  build:
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows-x64
            exe: sonisub.exe
          - os: ubuntu-22.04
            platform: linux-x64
            exe: sonisub
          - os: macos-14
            platform: macos-arm64
            exe: sonisub
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform }}

      - name: Test
        shell: bash
        run: cargo test --release --locked

      - name: Build release binary
        shell: bash
        run: cargo build --release --locked

      - name: Package
        shell: bash
        run: |
          NAME="sonisub-${{ matrix.platform }}-v${{ needs.prepare.outputs.version }}"
          mkdir -p "dist/$NAME"
          cp "target/release/${{ matrix.exe }}" README.md "dist/$NAME/"
          cd dist
          if [ "${{ runner.os }}" = Windows ]; then
            7z a -tzip "$NAME.zip" "./$NAME/*" > /dev/null
          else
            tar -czf "$NAME.tar.gz" -C "$NAME" .
          fi
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: sonisub-${{ matrix.platform }}
          path: |
            dist/*.zip
            dist/*.tar.gz

  release:
    needs: [prepare, build]
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Remove existing draft and tag
        if: needs.prepare.outputs.draft == 'true'
        uses: ClementTsang/delete-tag-and-release@v0.3.1
        continue-on-error: true
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          delete_release: true
          repo: ${{ github.repository }}
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.prepare.outputs.name }}
          body_path: artifacts/release-notes.md
          draft: ${{ needs.prepare.outputs.draft }}
          files: |
            artifacts/*.zip
            artifacts/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # Publishes the crate to crates.io from main, once per version: a version already there is
  # skipped, so re-running the workflow is safe. Runs after the builds' tests passed, or when
  # the GitHub release already existed (a manual run to publish an earlier version).
  publish:
    needs: [prepare, build]
    if: >-
      always() && github.ref == 'refs/heads/main' && needs.prepare.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Already on crates.io?
        id: check
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -A "sonisub-release (github.com/Zelenov/sonisub)" \
            "https://crates.io/api/v1/crates/sonisub/$VERSION")
          if [ "$CODE" = 200 ]; then
            echo "sonisub $VERSION is already on crates.io"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust toolchain
        if: steps.check.outputs.publish == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Publish
        if: steps.check.outputs.publish == 'true'
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
